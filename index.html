<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>誕生月×血液型</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #dff7ff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;

  overflow: hidden;

  display: flex;
  justify-content: center;
}


/* ========================================
   9:16画面
======================================== */

.app {

  width: min(100vw, 56.25vh);

  height: min(100vh, 177.777777vw);

  aspect-ratio: 9 / 16;

  overflow: hidden;

  padding: 1.2% 1.5% 1.2%;

  position: relative;

  background:

    radial-gradient(
      circle at 8% 5%,
      rgba(255,255,255,.9) 0 2%,
      transparent 2.5%
    ),

    radial-gradient(
      circle at 93% 7%,
      rgba(255,255,255,.9) 0 2%,
      transparent 2.5%
    ),

    linear-gradient(
      180deg,
      #d9f7ff 0%,
      #fff7fc 52%,
      #f7ffff 100%
    );

  color: #17406b;
}


/* ========================================
   タイトル部分
======================================== */

.header {

  height: 16.5%;

  text-align: center;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;
}


.title {

  margin: 0;

  padding: 1.2% 3%;

  background: white;

  border: 4px solid white;

  border-radius: 20px;

  box-shadow:
    0 3px 0 #8b62db;

  color: #ed3b9a;

  font-size:
    clamp(22px, 5.2vw, 42px);

  line-height: 1.05;

  font-weight: 1000;

  white-space: nowrap;
}


.title .x {
  color: #e9982b;
}


/* ========================================
   サブタイトル
======================================== */

.subtitle {

  margin:
    1.2% 0 .7%;

  padding:
    1.2% 5%;

  color: white;

  background: #f23b87;

  border-radius:
    0 0 14px 14px;

  font-size:
    clamp(11px, 2.6vw, 22px);

  line-height: 1.05;

  font-weight: 1000;

  white-space: nowrap;
}


/* ========================================
   説明
======================================== */

.help {

  margin: 0;

  color: #173e67;

  font-size:
    clamp(9px, 2vw, 16px);

  line-height: 1.1;

  font-weight: 900;

  white-space: nowrap;
}


/* ========================================
   12か月

   上部カウンターを削除したので
   ここを大きくする
======================================== */

.months {

  height: 76%;

  display: grid;

  grid-template-columns: 1fr 1fr;

  grid-template-rows: repeat(6, 1fr);

  gap: .8% 1.1%;
}


/* ========================================
   月カード
======================================== */

.month {

  min-height: 0;

  overflow: hidden;

  padding:
    1.5% 1.8%;

  border:
    1.5px solid #e6acd1;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #fff0fa,
      #eefaff
    );
}


.month:nth-child(4n + 2) {

  background: #eefaff;

  border-color: #88cfe9;
}


.month:nth-child(4n + 3) {

  background: #f0fff7;

  border-color: #94dfbe;
}


.month:nth-child(4n) {

  background: #f7efff;

  border-color: #c1a3ea;
}


/* ========================================
   月タイトル
======================================== */

.month-title {

  height: 27%;

  margin: 0;

  display: flex;

  align-items: center;

  padding-left: 1%;

  font-size:
    clamp(14px, 3vw, 25px);

  line-height: 1;

  font-weight: 1000;
}


/* ========================================
   血液型4マス
======================================== */

.cells {

  height: 73%;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 1.8%;
}


/* ========================================
   各マス
======================================== */

.cell {

  min-width: 0;

  min-height: 0;

  border:
    1.5px solid #f09ac5;

  border-radius: 8px;

  background: white;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  cursor: pointer;

  user-select: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    transform .08s,
    box-shadow .08s;
}


.cell.b {
  border-color: #62c2eb;
}


.cell.o {
  border-color: #6fd8a7;
}


.cell.ab {
  border-color: #efca50;
}


.cell:active {
  transform: scale(.94);
}


/* 血液型 */

.cell-name {

  font-size:
    clamp(8px, 2vw, 16px);

  line-height: 1;

  font-weight: 1000;
}


/* 人数 */

.count {

  margin-top: 5%;

  font-size:
    clamp(10px, 2.5vw, 19px);

  line-height: 1;

  font-weight: 1000;
}


/* タップ */

.tap {

  margin-top: 5%;

  font-size:
    clamp(5px, 1.35vw, 10px);

  line-height: 1;

  font-weight: 900;
}


/* ========================================
   ★ 5人達成したマス
======================================== */

.cell.done {

  background: #f04455;

  border-color: #d9273b;

  color: white;

  box-shadow:
    0 0 0 2px #ffb1b9,
    0 2px 6px rgba(0,0,0,.2);
}


/*
  達成後も数字を赤ではなく白にする
*/

.cell.done .count {

  color: white;

}


/*
  達成後のタップ文字も白
*/

.cell.done .tap {

  color: white;

}


/* ========================================
   下のボタン
======================================== */

.buttons {

  height: 7.5%;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 2%;
}


button {

  width: 38%;

  height: 75%;

  border: 0;

  border-radius: 999px;

  color: white;

  font-size:
    clamp(11px, 2.8vw, 22px);

  font-weight: 1000;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

  box-shadow:
    0 2px 4px rgba(0,0,0,.2);
}


button:active {

  transform: scale(.96);
}


.undo {

  background: #6734d5;
}


.reset {

  background: #e92878;
}

</style>
</head>


<body>


<div class="app">


<!-- =====================================
     タイトル
===================================== -->

<header class="header">

  <h1 class="title">

    誕生月
    <span class="x">×</span>
    血液型

  </h1>


  <div class="subtitle">

    各マス5人でコンプリート！

  </div>


  <p class="help">

    自分の誕生月と血液型をタップしてカウントしよう！

  </p>

</header>



<!-- =====================================
     12か月
===================================== -->

<main
  id="months"
  class="months"
></main>



<!-- =====================================
     下のボタン
===================================== -->

<div class="buttons">


  <button
    type="button"
    id="undoButton"
    class="undo"
  >

    ↩ 1つ戻す

  </button>



  <button
    type="button"
    id="resetButton"
    class="reset"
  >

    ↻ リセット

  </button>


</div>


</div>



<script>


/* ==========================================
   設定
========================================== */

const CONFIG = {

  /* 1マスに必要な人数 */

  targetPerCell: 5,


  /* 血液型 */

  groups: [

    {
      name: "A型",
      key: "A",
      className: "a"
    },

    {
      name: "B型",
      key: "B",
      className: "b"
    },

    {
      name: "O型",
      key: "O",
      className: "o"
    },

    {
      name: "AB型",
      key: "AB",
      className: "ab"
    }

  ],


  /* 12か月 */

  rows: [

    ["1月", "🌸"],

    ["2月", "💙"],

    ["3月", "🌷"],

    ["4月", "🍃"],

    ["5月", "🎏"],

    ["6月", "🌺"],

    ["7月", "🌻"],

    ["8月", "🌺"],

    ["9月", "🌙"],

    ["10月", "🎃"],

    ["11月", "🍁"],

    ["12月", "🎄"]

  ]

};



/* ==========================================
   保存
========================================== */

const STORAGE_KEY =
  "birthday_blood_counter_v4";


let counts = {};

let history = [];



/* ==========================================
   データ読み込み
========================================== */

function loadData() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!saved) {

    counts = {};

    history = [];

    return;

  }


  try {

    const data =
      JSON.parse(saved);


    counts =
      data.counts || {};


    history =
      Array.isArray(data.history)
        ? data.history
        : [];

  }

  catch (error) {

    counts = {};

    history = [];

  }

}



/* ==========================================
   データ保存
========================================== */

function saveData() {

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify({

      counts: counts,

      history: history

    })

  );

}



/* ==========================================
   キー
========================================== */

function makeKey(
  monthIndex,
  bloodType
) {

  return (
    monthIndex +
    "-" +
    bloodType
  );

}



/* ==========================================
   画面作成
========================================== */

function render() {


  const container =
    document.getElementById(
      "months"
    );


  container.innerHTML = "";


  CONFIG.rows.forEach(
    function(row, monthIndex) {


      const month =
        document.createElement(
          "section"
        );


      month.className =
        "month";



      /*
        月タイトル
      */

      const title =
        document.createElement(
          "h2"
        );


      title.className =
        "month-title";


      title.textContent =
        row[0] +
        " " +
        row[1];


      month.appendChild(
        title
      );



      /*
        血液型
      */

      const cells =
        document.createElement(
          "div"
        );


      cells.className =
        "cells";



      CONFIG.groups.forEach(
        function(group) {


          const key =
            makeKey(
              monthIndex,
              group.key
            );


          const count =
            Math.min(

              CONFIG.targetPerCell,

              Number(
                counts[key] || 0
              )

            );


          const cell =
            document.createElement(
              "div"
            );


          cell.className =
            "cell " +
            group.className;



          /*
            5人達成
          */

          if (
            count >=
            CONFIG.targetPerCell
          ) {

            cell.classList.add(
              "done"
            );

          }



          const name =
            document.createElement(
              "div"
            );


          name.className =
            "cell-name";


          name.textContent =
            group.name;



          const number =
            document.createElement(
              "div"
            );


          number.className =
            "count";


          number.textContent =
            count +
            "/" +
            CONFIG.targetPerCell;



          const tap =
            document.createElement(
              "div"
            );


          tap.className =
            "tap";


          tap.textContent =
            "タップで+1";



          cell.appendChild(name);

          cell.appendChild(number);

          cell.appendChild(tap);



          /*
            タップ
          */

          cell.addEventListener(
            "click",
            function() {

              addCount(key);

            }
          );


          cells.appendChild(
            cell
          );

        }
      );


      month.appendChild(
        cells
      );


      container.appendChild(
        month
      );

    }
  );

}



/* ==========================================
   +1
========================================== */

function addCount(key) {


  const current =
    Number(
      counts[key] || 0
    );


  /*
    5人なら増やさない
  */

  if (
    current >=
    CONFIG.targetPerCell
  ) {

    return;

  }


  counts[key] =
    current + 1;


  history.push(key);


  saveData();


  render();

}



/* ==========================================
   1つ戻す
========================================== */

function undo() {


  if (
    history.length === 0
  ) {

    return;

  }


  const key =
    history.pop();


  const current =
    Number(
      counts[key] || 0
    );


  if (
    current <= 1
  ) {

    delete counts[key];

  }

  else {

    counts[key] =
      current - 1;

  }


  saveData();


  render();

}



/* ==========================================
   リセット
========================================== */

function resetAll() {


  const answer =
    window.confirm(
      "カウントをすべて0に戻しますか？"
    );


  if (!answer) {

    return;

  }


  counts = {};

  history = [];


  saveData();


  render();

}



/* ==========================================
   ボタン
========================================== */

document
  .getElementById(
    "undoButton"
  )
  .addEventListener(
    "click",
    undo
  );


document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    resetAll
  );



/* ==========================================
   起動
========================================== */

loadData();

render();


</script>


</body>
</html>
